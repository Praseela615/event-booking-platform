<body><header class="navbar"><a class="brand" href="index.html"><span class="brand-mark">E</span> EventNova</a><nav><a href="admin.html">Dashboard</a><a class="active" href="checkin.html">Check-in</a></nav></header><main><section class="page-hero small-hero"><span class="eyebrow">STAFF CHECK-IN</span><h1>Welcome <em>attendees.</em></h1></section><section class="section compact"><div class="checkin-card"><div class="scanner">▦<small>QR SCANNER</small></div><h2>Scan or verify a ticket</h2><p class="muted">Use a camera scanner in a production app, or enter a demo booking ID below.</p><input id="bookingCode" placeholder="EVN-2026-0925-A34"><button class="btn btn-primary full" onclick="verifyTicket()">Verify ticket →</button><div id="checkinResult"></div></div></section></main><script src="js/main.js"></script><script>function verifyTicket(){const code=document.getElementById('bookingCode').value.trim();document.getElementById('checkinResult').innerHTML=code?'<div class="verified"><b>✓ VALID TICKET</b><p>Guest: EventNova Demo Guest<br>Event: Tech Innovation Summit<br>Seat: A3</p><button class="btn btn-primary" onclick="this.innerText=\'✓ Checked in\';this.disabled=true">Check in attendee</button></div>':'<p class="error">Enter a booking ID.</p>';}</script></body></html>
