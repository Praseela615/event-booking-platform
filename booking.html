<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book Tickets — EventNova</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body><header class="navbar"><a class="brand" href="index.html"><span class="brand-mark">E</span> EventNova</a><nav id="mainNav"><a href="index.html">Home</a><a href="events.html">Events</a><a href="tickets.html">My Tickets</a><a href="admin.html">Admin</a></nav><div class="nav-actions"><button class="icon-btn" id="themeToggle">◐</button><a class="btn btn-outline" href="login.html">Login</a><button class="menu-btn" id="menuBtn">☰</button></div></header>
<main><section class="page-hero small-hero"><span class="eyebrow">SECURE YOUR SPOT</span><h1>Book your <em>experience.</em></h1></section>
<section class="section compact"><div class="booking-layout"><form id="bookingForm" class="form-card"><h2>Attendee details</h2><label>Full name<input id="name" required placeholder="Your full name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Phone<input id="phone" required pattern="[0-9]{10}" placeholder="10-digit phone number"></label><label>Event<select id="eventSelect" required></select></label><label>Ticket type<select id="ticketType"><option value="999">General — ₹999</option><option value="1999">VIP — ₹1,999</option><option value="699">Student — ₹699</option></select></label><label>Number of tickets<input id="qty" type="number" min="1" max="10" value="1" required></label><label>Promo code<input id="promo" placeholder="Try EARLY20"></label><button class="btn btn-primary full" type="submit">Continue to checkout →</button></form>
<aside class="summary-card"><span class="eyebrow">ORDER SUMMARY</span><h2 id="summaryEvent">Select an event</h2><div class="summary-row"><span>Tickets</span><b id="summaryTickets">1</b></div><div class="summary-row"><span>Subtotal</span><b id="subtotal">₹999</b></div><div class="summary-row"><span>Discount</span><b id="discount">₹0</b></div><div class="summary-row"><span>GST (18%)</span><b id="tax">₹179.82</b></div><hr><div class="summary-row total"><span>Total</span><b id="total">₹1,178.82</b></div><p class="muted">Demo checkout only — no real payment is processed.</p></aside></div></section></main>
<script src="js/main.js"></script><script src="js/booking.js"></script></body></html>
